name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: test (go 1.23)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.23'
      - run: go build ./...
      - run: go vet ./...
      - run: go test -race -count=1 ./...
      - run: test -z "$(gofmt -l .)"
